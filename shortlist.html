<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Document</title>
</head>
<body class="bg-gradient-to-r from-[#0f172a] via-[#273449] to-[#312e81] p-4">
      <header>
    <div class="flex items-center justify-between gap-1 border p-2 bg-slate-500 rounded-md px-8 py-3 bg-gradient-to-r from-slate-400 via-slate-400/50 to-slate-500">
        <div class="flex items-center gap-2">
            <span class="text-4xl text-blue-400 leading-none drop-shadow-[0_0_6px_rgba(239,68,68,1)]">•</span>
            <h1 class="font-semibold text-lg mt-auto font-semibold text-white">DevScop</h1>
        </div >
        <div class="flex items-center gap-7 text-white">
            <a href="index.html" class="font-semibold text-lg font-semibold hover:text-yellow-500 ">Recherche</a>
            <a href="shortlist.html" class="font-semibold text-lg font-semibold hover:text-yellow-500 ">Shortlist</a>
            </div>
            </div>
    </header>
    <main class="min-h-screen h-auto overflow-visible gap-6 p-6 flex flex-col">
        <h1 class="text-6xl bg-gradient-to-r from-blue-400 via-blue-300 to-white bg-clip-text text-transparent p-4 font-semibold">Ma shortlist</h1>
        <p class="text-white opacity-50 px-4 text-xl">3 candidat(s) dans votre shortlist</p>
 <div class="w-full flex flex-col md:flex-row items-center justify-between gap-4">
    <div class="max-w-1/2 md:flex-1 min-w-0 border bg-slate-900 text-white rounded-lg p-3">
        <ul class="flex flex-wrap items-center gap-4 md:gap-2 text-lg">
            <li class="rounded px-3 py-1 whitespace-nowrap cursor-pointer btns matches"
                data-filtre="tous">
                Tous
            </li>
            <li class="flex items-center gap-2 rounded px-3 py-1 whitespace-nowrap matches cursor-pointer btns"
                data-filtre="avenir">
                À contacter
            </li>
            <li class="flex items-center gap-2 rounded px-3 py-1 whitespace-nowrap matches cursor-pointer btns"
                data-filtre="entretien">
                Entretien
        </li>
            <li class="flex items-center gap-2 rounded px-3 py-1 whitespace-nowrap matches cursor-pointer btns"
                data-filtre="retenu">
                Retenu   
            </li>
            <li class="flex items-center gap-2 rounded px-3 py-1 whitespace-nowrap matches cursor-pointer btns"
                data-filtre="refuse">
                Refusé
        </li>
        </ul>
    </div>
    <div class="w-full md:w-1/3 shrink-0">
        <input
            class="w-full px-4 py-3 text-white rounded-md bg-slate-800 outline-none focus:ring-2 focus:ring-blue-400"
            type="text"
            id="search_"
            placeholder="Rechercher un adversaire..."
        >
    </div>
</div>
    <div class="flex flex-col gap-4 max-h-[600px] overflow-y-auto" id="all_list">

</div>
    </main>
    
</body>
<script type="module" src="shortlist.js"></script>
</html>
